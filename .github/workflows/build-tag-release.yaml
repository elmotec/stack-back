name: "Build, Tag, and Release"

on:
  push:
    branches:
      - dev
    paths-ignore:
      - .gitignore
      - .github/renovate.json
      - .github/workflows/**
      - .pre-commit-config.yaml
      - LICENSE
      - README.md
      - docs/**

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BASE_VERSION: 1.5.4
  FORK_SUFFIX: elmotec

concurrency:
  group: dev-release
  cancel-in-progress: false

jobs:
  build-tag-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Get next version
        id: version
        run: |
          git fetch --tags origin
          prefix="v${BASE_VERSION}-${FORK_SUFFIX}."
          highest=-1
          while IFS= read -r tag; do
            number=${tag#"$prefix"}
            if [[ "$number" =~ ^[0-9]+$ ]] && (( 10#$number > highest )); then
              highest=$((10#$number))
            fi
          done < <(git tag --list "${prefix}*")
          echo "new_tag=${prefix}$((highest + 1))" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Bump version in files
        env:
          VERSION_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          [[ "$VERSION_TAG" == "v${BASE_VERSION}-${FORK_SUFFIX}."* ]]
          package_version="${VERSION_TAG#v}"
          package_version="${package_version/-${FORK_SUFFIX}./+${FORK_SUFFIX}.}"
          sed -i "s/__version__ = .*/__version__ = \"${package_version}\"/" src/restic_compose_backup/__init__.py
          sed -i "s/version = .*/version = \"${package_version}\"/" src/pyproject.toml
          sed -i "s/release = .*/release = \"${package_version}\"/" docs/conf.py
          uv lock --directory src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/restic_compose_backup/__init__.py src/pyproject.toml src/uv.lock docs/conf.py
          git commit -m "chore: set version ${package_version}"

      - name: Push version tag
        env:
          VERSION_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          # The tag publishes the version commit without pushing to protected dev.
          git tag "$VERSION_TAG"
          git push origin "refs/tags/$VERSION_TAG"

      - name: Log in to the Container registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Generate metadata for published image
        id: meta
        run: |
          TAG=${{ steps.version.outputs.new_tag }}
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "revision=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: src/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new_tag }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.url=${{ github.repositoryUrl }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.created=${{ steps.meta.outputs.timestamp }}

      - name: Attest container image build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new_tag }}
          format: spdx-json
          output-file: ./sbom.spdx.json

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new_tag }}
          format: cyclonedx-json
          output-file: ./sbom.cyclonedx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          sbom-path: ./sbom.cyclonedx.json
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Update release
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          allowUpdates: true
          artifacts: "sbom.spdx.json,sbom.cyclonedx.json"
          updateOnlyUnreleased: true
          prerelease: true
          generateReleaseNotes: true
          tag: ${{ steps.version.outputs.new_tag }}
